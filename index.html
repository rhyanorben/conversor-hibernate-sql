<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibernate → PostgreSQL</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#f4f6fa;color:#182338;font:16px system-ui,sans-serif}
  main{max-width:1200px;margin:48px auto;padding:0 24px} h1{font-size:32px;margin-bottom:8px}
  p{color:#59677b;line-height:1.6} .panel{background:white;padding:24px;border:1px solid #dce2ed;border-radius:16px;margin-top:24px}
  label{display:block;font-weight:600;margin-bottom:10px} textarea{width:100%;min-height:270px;resize:vertical;border:1px solid #b8c3d5;border-radius:8px;padding:16px;font:14px/1.55 ui-monospace,monospace;tab-size:4}
  textarea:focus,select:focus{outline:3px solid #bed6ff;border-color:#2864c8} .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
  button,select{font:inherit;border:1px solid #b8c3d5;border-radius:8px;padding:11px 16px;background:white;color:#182338} button{cursor:pointer;font-weight:600} button.primary{background:#225fc5;color:white;border-color:#225fc5}
  button:hover{filter:brightness(.95)} button:disabled{opacity:.5;cursor:default} .prefix{margin:0;font-weight:400} #status{min-height:24px;margin:16px 0 0;color:#315a3d} #status.error{color:#ae2525}
  .heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.heading label{margin:0} footer{color:#59677b;font-size:13px;margin-top:20px}
</style>
<main>
  <h1>Hibernate → PostgreSQL</h1>
  <p>Cole a SQL e os logs de binding. Gere a query com os valores preenchidos para testar no PostgreSQL.</p>
  <section class="panel">
    <label for="logs">Logs do Hibernate</label>
    <textarea id="logs" spellcheck="false" placeholder="Hibernate: select * from gestao.tbcontas_receber_titulo where idtitulo = ?&#10;binding parameter (1:BIGINT) <- [1292112]"></textarea>
    <div class="actions">
      <button class="primary" id="normal">Montar query</button>
      <label class="prefix" for="prefix">Comando:</label><select id="prefix" aria-label="Comando para adicionar à query"></select>
      <button id="command" disabled>Montar com comando</button>
      <button id="clear">Limpar</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section class="panel">
    <div class="heading"><label for="output">Query pronta</label><button id="copy" disabled>Copiar SQL</button></div>
    <textarea id="output" readonly spellcheck="false" placeholder="A SQL gerada aparecerá aqui."></textarea>
  </section>
  <footer>Processamento local. Nenhuma conexão com o banco de dados. EXPLAIN ANALYZE executa a query quando você a roda no PostgreSQL.</footer>
</main>
<script>
const logs = document.getElementById('logs'), output = document.getElementById('output'), status = document.getElementById('status'), prefix = document.getElementById('prefix'), copy = document.getElementById('copy');
function message(text, error=false){status.textContent=text;status.className=error?'error':'';}
async function generate(withCommand){
  output.value='';copy.disabled=true;
  try{
    const response=await fetch('/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({log:logs.value,prefix:withCommand?prefix.value:''})});
    const data=await response.json();if(!response.ok)throw new Error(data.error);
    output.value=data.sql;copy.disabled=false;message(`${data.count} query(s) montada(s).`);
  }catch(error){message(error.message,true);}
}
document.getElementById('normal').onclick=()=>generate(false);
document.getElementById('command').onclick=()=>generate(true);
document.getElementById('clear').onclick=()=>{logs.value='';output.value='';copy.disabled=true;message('');logs.focus();};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(output.value);message('SQL copiada.');}catch{output.focus();output.select();message('Selecionei a SQL. Pressione Ctrl+C para copiar.');}};
fetch('/prefixes').then(r=>r.json()).then(options=>{options.forEach(label=>{const option=document.createElement('option');option.value=option.textContent=label;prefix.append(option);});document.getElementById('command').disabled=!options.length;}).catch(()=>message('Não foi possível carregar os comandos. Recarregue a página.',true));
</script>
</html>
